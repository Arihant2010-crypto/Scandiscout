<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScandiScout - Skyscanner Flight Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-skyscanner: #0770e3;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: var(--sidebar-width);
            position: fixed;
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px 24px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .sidebar h2 { color: var(--text-main); font-size: 24px; font-weight: 800; margin-top: 0; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .sidebar h2::before { content: ''; display: inline-block; width: 8px; height: 24px; background: var(--accent-blue); border-radius: 4px; }
        .sidebar a { display: block; color: var(--text-muted); text-decoration: none; padding: 12px 16px; font-weight: 600; font-size: 15px; border-radius: 8px; margin-bottom: 8px; transition: all 0.2s ease; }
        .sidebar a:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }

        /* Main Workspace */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 50px;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        /* Skyscanner Search Panel Box */
        .search-widget {
            background: #141b2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 40px 1fr 160px;
            gap: 12px;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group select {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .input-group select:focus {
            border-color: var(--accent-blue);
        }

        .swap-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            margin-top: 18px;
            transition: background 0.2s;
        }

        .swap-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .search-btn {
            background: var(--accent-skyscanner);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            transition: background 0.2s, transform 0.1s;
        }

        .search-btn:hover {
            background: #005bb5;
            transform: translateY(-1px);
        }

        /* Flight Results List */
        .results-section h3 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .flight-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .flight-card:hover {
            border-color: var(--accent-blue);
        }

        .route-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .airline {
            font-weight: 700;
            color: var(--accent-blue);
            min-width: 120px;
        }

        .time-location {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .time-location span {
            font-size: 13px;
            color: var(--text-muted);
        }

        .price-tag {
            font-size: 22px;
            font-weight: 800;
            color: #10b981;
        }

        @media (max-width: 960px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; position: relative; height: auto; padding: 20px; }
            .main-content { margin-left: 0; padding: 30px 20px; }
            .search-grid { grid-template-columns: 1fr; }
            .swap-btn { margin: 0 auto; transform: rotate(90deg); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>ScandiScout</h2>
        <a href="index.html">← Back Home</a>
        <a href="denmark/index.html">Denmark Guide</a>
        <a href="norway/index.html">Norway Guide</a>
        <a href="sweden/index.html">Sweden Guide</a>
        <a href="flights.html" style="color: var(--accent-blue);">Flight Finder</a>
    </div>

    <div class="main-content">
        <h1>Scandic Flight Finder</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Select your departure location and Scandinavian destination to view real-time estimates.</p>

        <!-- Skyscanner Style Finder Box -->
        <div class="search-widget">
            <div class="search-grid">
                <div class="input-group">
                    <label for="origin-country">From (Origin)</label>
                    <select id="origin-country">
                        <option value="UK">United Kingdom (LON)</option>
                        <option value="DE">Germany (FRA)</option>
                        <option value="US">United States (JFK)</option>
                        <option value="NL">Netherlands (AMS)</option>
                    </select>
                </div>

                <button class="swap-btn" onclick="swapLocations()" title="Swap origin and destination">⇄</button>

                <div class="input-group">
                    <label for="destination-country">To (Destination)</label>
                    <select id="destination-country">
                        <option value="DK">Denmark (CPH)</option>
                        <option value="NO" selected>Norway (OSL)</option>
                        <option value="SE">Sweden (ARN)</option>
                    </select>
                </div>

                <button class="search-btn" onclick="executeFlightSearch()">Search Flights</button>
            </div>
        </div>

        <!-- Dynamic Results Panel -->
        <div class="results-section">
            <h3>Available Route Deals</h3>
            <div id="flight-results-list">
                <!-- Javascript injects routes here based on selection -->
            </div>
        </div>
    </div>

    <script>
        const flightDatabase = {
            "UK-NO": [
                { airline: "SAS Scandinavian", departure: "07:20 LHR", arrival: "10:35 OSL", duration: "2h 15m (Direct)", price: "€78" },
                { airline: "Norwegian Air", departure: "13:10 LGW", arrival: "16:20 OSL", duration: "2h 10m (Direct)", price: "€54" }
            ],
            "UK-DK": [
                { airline: "British Airways", departure: "08:00 LHR", arrival: "10:50 CPH", duration: "1h 50m (Direct)", price: "€82" },
                { airline: "Ryanair", departure: "18:40 STN", arrival: "21:25 CPH", duration: "1h 45m (Direct)", price: "€29" }
            ],
            "UK-SE": [
                { airline: "SAS Scandinavian", departure: "10:15 LHR", arrival: "13:45 ARN", duration: "2h 30m (Direct)", price: "€89" }
            ],
            "DE-NO": [
                { airline: "Lufthansa", departure: "09:30 FRA", arrival: "11:35 OSL", duration: "2h 05m (Direct)", price: "€112" }
            ]
        };

        function executeFlightSearch() {
            const origin = document.getElementById('origin-country').value;
            const destination = document.getElementById('destination-country').value;
            const routeKey = `${origin}-${destination}`;
            const resultsContainer = document.getElementById('flight-results-list');

            const flights = flightDatabase[routeKey] || [
                { airline: "SAS Regional", departure: "11:00 Regional", arrival: "14:15 Hub", duration: "3h 15m (1-Stop)", price: "€135" }
            ];

            resultsContainer.innerHTML = flights.map(flight => `
                <div class="flight-card">
                    <div class="route-info">
                        <div class="airline">${flight.airline}</div>
                        <div class="time-location">
                            <strong>${flight.departure} → ${flight.arrival}</strong>
                            <span>${flight.duration}</span>
                        </div>
                    </div>
                    <div class="price-tag">${flight.price}</div>
                </div>
            `).join('');
        }

        function swapLocations() {
            const originSelect = document.getElementById('origin-country');
            const destSelect = document.getElementById('destination-country');
            
            const tempVal = originSelect.value;
            // Check if swapped value exists in destination dropdown options
            if ([...destSelect.options].some(opt => opt.value === tempVal)) {
                originSelect.value = destSelect.value;
                destSelect.value = tempVal;
                executeFlightSearch();
            }
        }

        // Initialize default search on page load
        window.onload = executeFlightSearch;
    </script>
</body>
</html>
